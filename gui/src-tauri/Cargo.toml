[package]
name = "dcpwizard-gui"
version = "1.3.0"
description = "DCP Wizard Desktop GUI"
authors = ["DCP Wizard"]
edition = "2021"

[lib]
name = "dcpwizard_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["time", "rt"] }
postkit = { path = "../../extern/postkit" }
dcpwizard-core = { path = "../../rust/crates/dcpwizard-core" }
guikit = { path = "../../extern/guikit/rust" }
tauri-plugin-opener = "2"

[dev-dependencies]
hound = "3.5"
tempfile = "3"

# tauri's CLI turns this off for `tauri dev` so the page comes from vite;
# production keeps it on so the webview serves the bundled frontend instead of
# localhost:1421, which is a blank window when vite is not running
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# dcpwizard-core pulls dcpdoctor-core, which depends on postkit by git. pointing
# that at the submodule this build already compiles keeps postkit to one compile.
[patch."https://github.com/PostPerfection/postkit.git"]
postkit = { path = "../../extern/postkit" }

# Optimize postkit in debug builds (color math is too slow unoptimized)
[profile.dev.package.postkit]
opt-level = 2
