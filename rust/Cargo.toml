[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "1.4.0"

[workspace.dependencies]
asdcplib = { git = "https://github.com/PostPerfection/asdcplib-rs.git", rev = "c8c24cc2d3ed4d22460b744e55b0b840ed98cbfa" }
clap = { version = "4", features = ["derive"] }
dcpdoctor-core = { git = "https://github.com/PostPerfection/dcpdoctor.git", rev = "0704b6e3123aaa06e1a10e2b48f5a0c54edc510c" }
postkit = { path = "../extern/postkit", features = ["grok-ffi", "tms"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# dcpdoctor-core depends on postkit by git. pointing that at the submodule this
# workspace already builds keeps postkit to one compile instead of two.
[patch."https://github.com/PostPerfection/postkit.git"]
postkit = { path = "../extern/postkit" }
