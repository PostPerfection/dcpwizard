[package]
name = "dcpwizard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DCP Wizard CLI — Digital Cinema Package creator"

[[bin]]
name = "dcpwizard"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete = "4"
dcpwizard-core = { path = "../dcpwizard-core" }
postkit.workspace = true
ctrlc = "3"
serde_json.workspace = true
tempfile = "3"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
asdcplib.workspace = true
assert_cmd = "2"
base64 = "0.22"
chrono = "0.4"
dcpdoctor-core.workspace = true
dolby_vision = "3.3"
hound = "3.5"
libc = "0.2"
predicates = "3"
tempfile = "3"
zip = "8"

[package.metadata.deb]
name = "dcpwizard"
maintainer = "Post Perfection <dev@postperfection.com>"
section = "video"
priority = "optional"
# $auto finds no package for the bundled libgrokj2k and drops every dependency
depends = "libc6 (>= 2.39), libssl3t64 (>= 3.0.0), libstdc++6 (>= 13.1), zlib1g (>= 1:1.1.4)"
recommends = "ffmpeg, mpv"
# the desktop package installs the same /usr/bin and /usr/lib files
conflicts = "dcp-wizard"
replaces = "dcp-wizard"
assets = [
    ["target/release/dcpwizard", "usr/bin/", "755"],
    ["target/release/libgrokj2k.so.1", "usr/lib/dcpwizard/", "644"],
    ["../../../README.md", "usr/share/doc/dcpwizard/README.md", "644"],
    ["../../../CHANGELOG.md", "usr/share/doc/dcpwizard/CHANGELOG.md", "644"],
]
extended-description = """\
DCP Wizard creates valid Digital Cinema Packages from video sources, \
image sequences, and WAV audio, conforming to SMPTE ST 429 (Bv2.1) \
and Interop standards. Free alternative to easyDCP Creator+."""
