name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          workspace_version=$(awk '/^\[workspace.package\]/{found=1; next} /^\[/{found=0} found && /^version = / {gsub(/[" ]/, "", $3); print $3; exit}' rust/Cargo.toml)
          desktop_crate_version=$(awk '/^\[package\]/{found=1; next} /^\[/{found=0} found && /^version = / {gsub(/[" ]/, "", $3); print $3; exit}' gui/src-tauri/Cargo.toml)
          desktop_version=$(jq -r .version gui/src-tauri/tauri.conf.json)
          frontend_version=$(jq -r .version gui/package.json)

          release_version="$workspace_version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_version="${GITHUB_REF_NAME#v}"
          fi

          for version in "$workspace_version" "$desktop_crate_version" "$desktop_version" "$frontend_version"; do
            if [ "$version" != "$release_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match project version $version"
              exit 1
            fi
          done

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$version]" 'index($0, heading) == 1 {found = 1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no notes for $version"
            exit 1
          fi

      - name: Upload release notes
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            artifact: dcpwizard-linux-x86_64
            binary: dcpwizard
          - os: macos-latest
            name: macos
            artifact: dcpwizard-macos-aarch64
            binary: dcpwizard
          - os: windows-2022
            name: windows
            artifact: dcpwizard-windows-x86_64
            binary: dcpwizard.exe

    runs-on: ${{ matrix.os }}
    name: CLI (${{ matrix.name }})

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxml2-dev \
            libssl-dev \
            libxerces-c-dev \
            libasound2-dev \
            patchelf

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$OPENSSL_PREFIX/lib:$(brew --prefix xerces-c)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix xerces-c)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install libxml2 openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - uses: PostPerfection/ffmpeg-mpv-builds@v1.0.0
        with:
          release: v1.0.0

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1.1.3
        with:
          grok-ref: v20.4.17

      - name: Build release
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: cargo build --release

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip rust/target/release/${{ matrix.binary }}

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip rust/target/release/${{ matrix.binary }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/lib
          cp rust/target/release/${{ matrix.binary }} dist/
          for candidate in "$GITHUB_WORKSPACE/grok-install/lib64" "$GITHUB_WORKSPACE/grok-install/lib"; do
            if [ -d "$candidate" ]; then GROK_LIB="$candidate"; break; fi
          done
          if [ -z "${GROK_LIB:-}" ]; then
            echo "no grok library directory under grok-install"
            exit 1
          fi
          # the binary links libgrokj2k and FFmpeg at load time, so the archive carries them
          # and looks for them beside itself instead of on LD_LIBRARY_PATH
          if [ "$RUNNER_OS" = "Linux" ]; then
            scripts/bundle-linux-cli-libraries.sh dist/${{ matrix.binary }} dist/lib "$GROK_LIB" "$FFMPEG_MPV_DIR/lib"
            patchelf --set-rpath '$ORIGIN/lib' dist/${{ matrix.binary }}
          else
            scripts/bundle-macos-cli-libraries.sh dist/${{ matrix.binary }} dist/lib "$GROK_LIB" "$FFMPEG_MPV_DIR/lib"
          fi
          cp "$FFMPEG_MPV_DIR/THIRD-PARTY-LICENSES" dist/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "rust/target/release/${{ matrix.binary }}" "dist/"
          # the exe links grokj2k.dll, FFmpeg and the vcpkg libraries at load time, so ship them alongside
          ./scripts/bundle-windows-cli-dlls.ps1 -Binary "dist/${{ matrix.binary }}" `
            -SearchDirectories "$env:GITHUB_WORKSPACE/grok-install/bin", "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin", "$env:FFMPEG_MPV_DIR/bin"
          Copy-Item "$env:FFMPEG_MPV_DIR/THIRD-PARTY-LICENSES" "dist/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt"
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.artifact }}.zip"

      # what a user does with the download: unpack it and run it, with nothing
      # pointing the loader at a grok or FFmpeg install
      - name: The unpacked archive runs on its own (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked
          tar -xzf ${{ matrix.artifact }}.tar.gz -C unpacked
          cd unpacked
          if [ "$RUNNER_OS" = "macOS" ]
          then
            libavcodec=lib/libavcodec.62.dylib
          else
            libavcodec=lib/libavcodec.so.62
          fi
          for file in "$libavcodec" THIRD-PARTY-LICENSES-ffmpeg-mpv.txt
          do
            if [ ! -f "$file" ]
            then
              echo "the archive does not carry $file"
              find . -type f | sort
              exit 1
            fi
          done
          if [ "$RUNNER_OS" = "macOS" ]
          then
            for file in ./${{ matrix.binary }} lib/*.dylib
            do
              otool -L "$file"
              # a Mac without Homebrew has only /usr/lib and /System
              if otool -L "$file" | awk 'NR > 1 {print $1}' | grep -vE '^(/usr/lib/|/System/|@rpath/|@loader_path/)'
              then
                echo "$file loads a library from outside the archive"
                exit 1
              fi
            done
          fi
          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            ./${{ matrix.binary }} --version

      - name: The unpacked archive runs on its own (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path unpacked
          Expand-Archive -Path "${{ matrix.artifact }}.zip" -DestinationPath unpacked
          # the runner's System32 has the VC++ runtime, which hides a missing copy from the run below
          foreach ($runtime in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            if (-not (Test-Path (Join-Path unpacked $runtime))) { throw "the archive does not carry $runtime" }
          }
          foreach ($file in "avcodec-62.dll", "THIRD-PARTY-LICENSES-ffmpeg-mpv.txt") {
            if (-not (Test-Path (Join-Path unpacked $file))) { throw "the archive does not carry $file" }
          }
          # setup-grok and ffmpeg-mpv-builds put their bin directories on PATH, which a user's machine does not have
          $env:PATH = @("$env:SystemRoot\System32", (Resolve-Path unpacked).Path) -join [IO.Path]::PathSeparator
          & "unpacked/${{ matrix.binary }}" --version
          if ($LASTEXITCODE -ne 0) { throw "the unpacked archive exited with $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  cli-deb:
    needs: version
    runs-on: ubuntu-24.04
    name: CLI (.deb)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev libasound2-dev patchelf
          cargo install cargo-deb

      - uses: PostPerfection/ffmpeg-mpv-builds@v1.0.0
        with:
          release: v1.0.0

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1.1.3
        with:
          grok-ref: v20.4.17

      - name: Build release
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: cargo build --release -p dcpwizard-cli

      # the deb carries libgrokj2k and FFmpeg at /usr/lib/dcpwizard, like the desktop deb and rpm
      - name: Bundle libgrokj2k and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$GITHUB_WORKSPACE/grok-install/lib64" "$GITHUB_WORKSPACE/grok-install/lib"
          do
            if [ -f "$candidate/libgrokj2k.so.1" ]
            then
              GROK_LIB="$candidate"
              break
            fi
          done
          if [ -z "${GROK_LIB:-}" ]
          then
            echo "no libgrokj2k.so.1 under grok-install/lib64 or grok-install/lib"
            exit 1
          fi
          # Cargo.toml's [package.metadata.deb] assets name every library this copies
          scripts/bundle-linux-cli-libraries.sh rust/target/release/dcpwizard rust/target/release "$GROK_LIB" "$FFMPEG_MPV_DIR/lib"
          cp "$FFMPEG_MPV_DIR/THIRD-PARTY-LICENSES" rust/target/release/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt
          # strip run after patchelf can corrupt the binary, so cargo deb gets --no-strip
          strip rust/target/release/dcpwizard
          patchelf --set-rpath /usr/lib/dcpwizard rust/target/release/dcpwizard

      - name: Build .deb package
        working-directory: rust
        run: cargo deb -p dcpwizard-cli --no-build --no-strip

      # the LD_LIBRARY_PATH setup-grok and ffmpeg-mpv-builds export would find libraries the package does not carry
      - name: Test installed CLI
        shell: bash
        run: |
          set -euo pipefail
          package=$(realpath "$(find rust/target/debian -name '*.deb' -print -quit)")
          dpkg-deb -f "$package" Depends
          dpkg-deb -c "$package"
          dpkg-deb -c "$package" | grep -F ./usr/share/doc/dcpwizard/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt
          sudo apt-get install -y "$package"
          env -u LD_LIBRARY_PATH dcpwizard --version
          env -u LD_LIBRARY_PATH ldd /usr/bin/dcpwizard
          for library in libgrokj2k.so.1 libavcodec.so.62 libavfilter.so.11 libswscale.so.9
          do
            env -u LD_LIBRARY_PATH ldd /usr/bin/dcpwizard | grep -F "$library => /usr/lib/dcpwizard/$library"
          done
          # the runner already has every library the package depends on, a clean image does not
          docker run --rm -v "$package:/tmp/dcpwizard.deb:ro" ubuntu:24.04 bash -euo pipefail -c \
            'apt-get update && apt-get install -y --no-install-recommends /tmp/dcpwizard.deb && dcpwizard --version'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcpwizard-deb
          path: rust/target/debian/*.deb

  gui:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-2022
            name: Windows

    runs-on: ${{ matrix.os }}
    name: GUI (${{ matrix.name }})

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.8.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxml2-dev \
            libssl-dev \
            libxerces-c-dev \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libarchive-tools

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$OPENSSL_PREFIX/lib:$(brew --prefix xerces-c)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix xerces-c)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install libxml2 openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - uses: PostPerfection/ffmpeg-mpv-builds@v1.0.0
        with:
          release: v1.0.0

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1.1.3
        with:
          grok-ref: v20.4.17

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Build CLI sidecar (Unix)
        if: runner.os != 'Windows'
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        shell: bash
        run: |
          cargo build --release -p dcpwizard-cli
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          cp target/release/dcpwizard ../gui/src-tauri/dcpwizard-${TRIPLE}
          # the deb and rpm put the sidecar in /usr/bin, same rpath as the gui
          if [ "$RUNNER_OS" = "Linux" ]; then
            patchelf --set-rpath '$ORIGIN/../lib/dcpwizard' ../gui/src-tauri/dcpwizard-${TRIPLE}
          fi

      - name: Build CLI sidecar (Windows)
        if: runner.os == 'Windows'
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: |
          cargo build --release -p dcpwizard-cli
          Copy-Item "target/release/dcpwizard.exe" "../gui/src-tauri/dcpwizard-x86_64-pc-windows-msvc.exe"

      # tauri.windows.conf.json ships every dll staged here beside the installed exes
      - name: Stage grok, FFmpeg, libmpv and VC++ runtime dlls (Windows)
        if: runner.os == 'Windows'
        run: |
          $searchDirectories = "$env:GITHUB_WORKSPACE/grok-install/bin", "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin", "$env:FFMPEG_MPV_DIR/bin"
          ./scripts/bundle-windows-cli-dlls.ps1 -Binary "gui/src-tauri/dcpwizard-x86_64-pc-windows-msvc.exe" -SearchDirectories $searchDirectories
          # libmpv is the one dll the gui imports that the sidecar does not
          Copy-Item "$env:FFMPEG_MPV_DIR/bin/libmpv-2.dll" "gui/src-tauri/"
          ./scripts/bundle-windows-cli-dlls.ps1 -Binary "gui/src-tauri/libmpv-2.dll" -SearchDirectories $searchDirectories
          Copy-Item "$env:FFMPEG_MPV_DIR/THIRD-PARTY-LICENSES" "gui/src-tauri/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt"

      # the deb and rpm ship it through bundle.linux.*.files, the .app through bundle.macOS.frameworks
      - name: Stage grok library (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$GITHUB_WORKSPACE/grok-install/lib64" "$GITHUB_WORKSPACE/grok-install/lib"; do
            if [ -d "$candidate" ]; then GROK_LIB="$candidate"; break; fi
          done
          if [ -z "${GROK_LIB:-}" ]; then
            echo "no grok library directory under grok-install"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            library=libgrokj2k.so.1
          else
            library=libgrokj2k.1.dylib
          fi
          cp -L "$GROK_LIB/$library" "gui/src-tauri/$library"

      # asdcplib links OpenSSL and Xerces-C as shared libraries whatever OPENSSL_STATIC says
      - name: Stage Homebrew libraries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          staging="$GITHUB_WORKSPACE/gui/src-tauri/homebrew-libraries"
          scripts/stage-macos-homebrew-libraries.sh "gui/src-tauri/dcpwizard-${TRIPLE}" "$staging"
          ls -la "$staging"
          echo "STAGED_HOMEBREW_LIBRARIES=$staging" >> "$GITHUB_ENV"

      # adds the FFmpeg and libmpv libraries and their licence file to the deb, rpm and .app, and the Homebrew libraries to the .app
      - name: Generate the FFmpeg and libmpv bundle config (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          scripts/ffmpeg-mpv-bundle-config.sh > "$RUNNER_TEMP/ffmpeg-mpv-bundle.json"
          jq . "$RUNNER_TEMP/ffmpeg-mpv-bundle.json"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          OPENSSL_STATIC: "1"
          # the bundle carries no Homebrew lcms2
          LCMS2_STATIC: "1"
        with:
          projectPath: gui
          args: ${{ runner.os != 'Windows' && format('--config {0}/ffmpeg-mpv-bundle.json', runner.temp) || '' }}

      - name: The installer carries its dlls (Windows)
        if: runner.os == 'Windows'
        run: |
          $installer = Get-ChildItem "gui/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer not found" }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object { $_.DisplayName -eq "DCP Wizard" } |
            Select-Object -First 1
          if ($null -eq $entry) { throw "Installed application was not registered" }
          $installDirectory = $entry.InstallLocation.Trim('"')
          foreach ($dll in Get-ChildItem gui/src-tauri/*.dll) {
            if (-not (Test-Path (Join-Path $installDirectory $dll.Name))) { throw "the installer does not carry $($dll.Name)" }
          }
          foreach ($file in "libmpv-2.dll", "avcodec-62.dll", "THIRD-PARTY-LICENSES-ffmpeg-mpv.txt") {
            if (-not (Test-Path (Join-Path $installDirectory $file))) { throw "the installer does not carry $file" }
          }
          $env:PATH = @("$env:SystemRoot\System32", $installDirectory) -join [IO.Path]::PathSeparator
          & (Join-Path $installDirectory "dcpwizard.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "the installed sidecar exited with $LASTEXITCODE" }

      - name: The msi carries its dlls (Windows)
        if: runner.os == 'Windows'
        run: |
          $nsisEntry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object { $_.DisplayName -eq "DCP Wizard" } |
            Select-Object -First 1
          if ($null -eq $nsisEntry) { throw "NSIS installer was not registered" }
          $uninstall = Start-Process -FilePath $nsisEntry.UninstallString.Trim('"') -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstaller exited with $($uninstall.ExitCode)" }
          # the NSIS uninstaller returns before it removes the entry
          foreach ($attempt in 1..30) {
            $nsisEntry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
              Where-Object { $_.DisplayName -eq "DCP Wizard" } |
              Select-Object -First 1
            if ($null -eq $nsisEntry) { break }
            Start-Sleep -Seconds 1
          }
          if ($null -ne $nsisEntry) { throw "NSIS installer was still registered after uninstall" }
          $installer = Get-ChildItem "gui/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($null -eq $installer) { throw "msi not found" }
          $install = Start-Process -FilePath msiexec -ArgumentList "/i `"$($installer.FullName)`" /qn" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "msi exited with $($install.ExitCode)" }
          $uninstallKeys = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallKeys |
            Where-Object { $_.DisplayName -eq "DCP Wizard" } |
            Select-Object -First 1
          if ($null -eq $entry) { throw "Installed application was not registered" }
          $installDirectory = "$($entry.InstallLocation)".Trim('"')
          if ($installDirectory -eq "") { $installDirectory = Split-Path ($entry.DisplayIcon -replace ',\d+$', '').Trim('"') }
          foreach ($dll in Get-ChildItem gui/src-tauri/*.dll) {
            if (-not (Test-Path (Join-Path $installDirectory $dll.Name))) { throw "the msi does not carry $($dll.Name)" }
          }
          foreach ($file in "libmpv-2.dll", "avcodec-62.dll", "THIRD-PARTY-LICENSES-ffmpeg-mpv.txt") {
            if (-not (Test-Path (Join-Path $installDirectory $file))) { throw "the msi does not carry $file" }
          }
          $env:PATH = @("$env:SystemRoot\System32", $installDirectory) -join [IO.Path]::PathSeparator
          & (Join-Path $installDirectory "dcpwizard.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "the installed sidecar exited with $LASTEXITCODE" }
          $uninstall = Start-Process -FilePath msiexec -ArgumentList "/x `"$($installer.FullName)`" /qn" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "msi uninstall exited with $($uninstall.ExitCode)" }
          $entry = Get-ItemProperty $uninstallKeys |
            Where-Object { $_.DisplayName -eq "DCP Wizard" } |
            Select-Object -First 1
          if ($null -ne $entry) { throw "msi was still registered after uninstall" }

      # every check runs with the loader paths setup-grok and ffmpeg-mpv-builds exported unset
      - name: The packages run without a grok or FFmpeg install (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle=gui/src-tauri/target/release/bundle
          bundled_libraries="libgrokj2k.so.1 libmpv.so.2 libavcodec.so.62"
          licence=usr/share/doc/dcpwizard/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt

          check_binaries() {
            for binary in "$@"; do
              env -u LD_LIBRARY_PATH ldd "$binary"
              if env -u LD_LIBRARY_PATH ldd "$binary" | grep -q "not found"; then
                echo "$binary has an unresolved library"
                exit 1
              fi
            done
          }

          ls -la "$bundle"/rpm "$bundle"/deb "$bundle"/appimage
          rpm=$(find "$bundle/rpm" -name '*.rpm' ! -name '*.sig' -print -quit)
          rpm -qpl "$rpm"
          rpm -qpR "$rpm"
          if ! rpm -qpR "$rpm" | grep -qxF 'libass.so.9()(64bit)'
          then
            echo "the rpm does not require libass.so.9()(64bit)"
            exit 1
          fi
          if rpm -qpR "$rpm" | grep -F mpv-libs
          then
            echo "the rpm still requires mpv-libs"
            exit 1
          fi
          rpm_paths=$(rpm -qpl "$rpm")
          for path in $(printf '/usr/lib/dcpwizard/%s ' $bundled_libraries) "/$licence"
          do
            if ! echo "$rpm_paths" | grep -qxF "$path"
            then
              echo "rpm -qpl does not list $path"
              exit 1
            fi
          done
          rpm_root=$(mktemp -d)
          bsdtar -xf "$rpm" -C "$rpm_root"
          for path in $bundled_libraries
          do
            if [ ! -f "$rpm_root/usr/lib/dcpwizard/$path" ]
            then
              echo "the rpm does not carry usr/lib/dcpwizard/$path"
              find "$rpm_root" -type f | sort
              exit 1
            fi
          done
          check_binaries "$rpm_root/usr/bin/dcpwizard" "$rpm_root/usr/bin/dcpwizard-gui"
          env -u LD_LIBRARY_PATH "$rpm_root/usr/bin/dcpwizard" --version

          appimage=$(realpath "$(find "$bundle/appimage" -name '*.AppImage' -print -quit)")
          appimage_root=$(mktemp -d)
          (cd "$appimage_root" && "$appimage" --appimage-extract >/dev/null)
          for path in $bundled_libraries
          do
            if [ ! -f "$appimage_root/squashfs-root/usr/lib/$path" ]
            then
              echo "the AppImage does not carry usr/lib/$path"
              ls "$appimage_root/squashfs-root/usr/lib"
              exit 1
            fi
          done
          env -u LD_LIBRARY_PATH "$appimage_root/squashfs-root/usr/bin/dcpwizard" --version

          deb=$(realpath "$(find "$bundle/deb" -name '*.deb' -print -quit)")
          depends=$(dpkg-deb -f "$deb" Depends)
          echo "$depends"
          if echo "$depends" | grep -F libmpv2
          then
            echo "the deb still depends on libmpv2"
            exit 1
          fi
          if ! echo "$depends" | grep -qF libass9
          then
            echo "the deb does not depend on libass9"
            exit 1
          fi
          dpkg-deb -c "$deb"
          deb_paths=$(dpkg-deb -c "$deb" | awk '{print $NF}' | sed 's|^\./||')
          for path in $(printf 'usr/lib/dcpwizard/%s ' $bundled_libraries) "$licence"
          do
            if ! echo "$deb_paths" | grep -qxF "$path"
            then
              echo "the deb does not carry $path"
              exit 1
            fi
          done
          sudo apt-get install -y "$deb"
          check_binaries /usr/bin/dcpwizard /usr/bin/dcpwizard-gui
          for library in libmpv.so.2 libavcodec.so.62
          do
            env -u LD_LIBRARY_PATH ldd /usr/bin/dcpwizard-gui | grep -F "$library => /usr/bin/../lib/dcpwizard/$library"
          done
          env -u LD_LIBRARY_PATH dcpwizard --version

      # the bundler rewrites no load command, a missed relink shows up as a runner path
      - name: The app runs without a grok or FFmpeg install (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ls -la gui/src-tauri/target/release/bundle/macos
          app=$(find gui/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "no .app under gui/src-tauri/target/release/bundle/macos"
            exit 1
          fi
          for path in Frameworks/libgrokj2k.1.dylib Frameworks/libmpv.2.dylib Frameworks/libavcodec.62.dylib Resources/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt
          do
            if [ ! -f "$app/Contents/$path" ]
            then
              echo "the app does not carry Contents/$path"
              find "$app" -type f | sort
              exit 1
            fi
          done
          for binary in "$app/Contents/MacOS/dcpwizard" "$app/Contents/MacOS/dcpwizard-gui" "$app"/Contents/Frameworks/*.dylib
          do
            otool -L "$binary"
            if otool -L "$binary" | grep -E "/Users/runner|/opt/homebrew|/usr/local"
            then
              echo "$binary loads a library from the build tree or Homebrew"
              exit 1
            fi
          done
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$app/Contents/MacOS/dcpwizard" --version
          # a missing dylib kills the gui at exec, so it has to be alive a few seconds later
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$app/Contents/MacOS/dcpwizard-gui" &
          gui_pid=$!
          sleep 8
          kill -0 "$gui_pid"
          kill "$gui_pid"

      - name: Upload GUI packages
        uses: actions/upload-artifact@v4
        with:
          name: dcpwizard-gui-${{ matrix.name }}
          path: |
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/rpm/*.rpm
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/msi/*.msi
            gui/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [cli, cli-deb, gui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DCP Wizard ${{ github.ref_name }}
          body_path: artifacts/release-notes/release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*-setup.exe
