name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            artifact: dcpwizard-linux-x86_64
            binary: dcpwizard
          - os: macos-latest
            name: macos
            artifact: dcpwizard-macos-aarch64
            binary: dcpwizard
          - os: windows-2022
            name: windows
            artifact: dcpwizard-windows-x86_64
            binary: dcpwizard.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxml2-dev \
            libssl-dev \
            libxerces-c-dev \
            libasound2-dev \
            patchelf

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$OPENSSL_PREFIX/lib:$(brew --prefix xerces-c)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix xerces-c)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install libxml2 openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - uses: PostPerfection/ffmpeg-mpv-builds@v1.0.0
        with:
          release: v1.0.0

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1.1.3
        with:
          grok-ref: v20.4.16

      - name: Build release
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: cargo build --release

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip rust/target/release/${{ matrix.binary }}

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip rust/target/release/${{ matrix.binary }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/lib
          cp rust/target/release/${{ matrix.binary }} dist/
          for candidate in "$GITHUB_WORKSPACE/grok-install/lib64" "$GITHUB_WORKSPACE/grok-install/lib"; do
            if [ -d "$candidate" ]; then GROK_LIB="$candidate"; break; fi
          done
          if [ -z "${GROK_LIB:-}" ]; then
            echo "no grok library directory under grok-install"
            exit 1
          fi
          # the binary links libgrokj2k and FFmpeg at load time, so the archive carries them
          # and looks for them beside itself instead of on LD_LIBRARY_PATH
          if [ "$RUNNER_OS" = "Linux" ]; then
            scripts/bundle-linux-cli-libraries.sh dist/${{ matrix.binary }} dist/lib "$GROK_LIB" "$FFMPEG_MPV_DIR/lib"
            patchelf --set-rpath '$ORIGIN/lib' dist/${{ matrix.binary }}
          else
            scripts/bundle-macos-cli-libraries.sh dist/${{ matrix.binary }} dist/lib "$GROK_LIB" "$FFMPEG_MPV_DIR/lib"
          fi
          cp "$FFMPEG_MPV_DIR/THIRD-PARTY-LICENSES" dist/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "rust/target/release/${{ matrix.binary }}" "dist/"
          # the exe links grokj2k.dll, FFmpeg and the vcpkg libraries at load time, so ship them alongside
          ./scripts/bundle-windows-cli-dlls.ps1 -Binary "dist/${{ matrix.binary }}" `
            -SearchDirectories "$env:GITHUB_WORKSPACE/grok-install/bin", "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin", "$env:FFMPEG_MPV_DIR/bin"
          Copy-Item "$env:FFMPEG_MPV_DIR/THIRD-PARTY-LICENSES" "dist/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt"
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.artifact }}.zip"

      # what a user does with the download: unpack it and run it, with nothing
      # pointing the loader at a grok or FFmpeg install
      - name: The unpacked archive runs on its own (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked
          tar -xzf ${{ matrix.artifact }}.tar.gz -C unpacked
          cd unpacked
          if [ "$RUNNER_OS" = "macOS" ]
          then
            libavcodec=lib/libavcodec.62.dylib
          else
            libavcodec=lib/libavcodec.so.62
          fi
          for file in "$libavcodec" THIRD-PARTY-LICENSES-ffmpeg-mpv.txt
          do
            if [ ! -f "$file" ]
            then
              echo "the archive does not carry $file"
              find . -type f | sort
              exit 1
            fi
          done
          if [ "$RUNNER_OS" = "macOS" ]
          then
            for file in ./${{ matrix.binary }} lib/*.dylib
            do
              otool -L "$file"
              # a Mac without Homebrew has only /usr/lib and /System
              if otool -L "$file" | awk 'NR > 1 {print $1}' | grep -vE '^(/usr/lib/|/System/|@rpath/|@loader_path/)'
              then
                echo "$file loads a library from outside the archive"
                exit 1
              fi
            done
          fi
          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            ./${{ matrix.binary }} --version

      - name: The unpacked archive runs on its own (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path unpacked
          Expand-Archive -Path "${{ matrix.artifact }}.zip" -DestinationPath unpacked
          # the runner's System32 has the VC++ runtime, which hides a missing copy from the run below
          foreach ($runtime in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            if (-not (Test-Path (Join-Path unpacked $runtime))) { throw "the archive does not carry $runtime" }
          }
          foreach ($file in "avcodec-62.dll", "THIRD-PARTY-LICENSES-ffmpeg-mpv.txt") {
            if (-not (Test-Path (Join-Path unpacked $file))) { throw "the archive does not carry $file" }
          }
          # setup-grok and ffmpeg-mpv-builds put their bin directories on PATH, which a user's machine does not have
          $env:PATH = @("$env:SystemRoot\System32", (Resolve-Path unpacked).Path) -join [IO.Path]::PathSeparator
          & "unpacked/${{ matrix.binary }}" --version
          if ($LASTEXITCODE -ne 0) { throw "the unpacked archive exited with $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  deb:
    runs-on: ubuntu-24.04
    name: Build .deb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev libasound2-dev patchelf
          cargo install cargo-deb

      - uses: PostPerfection/ffmpeg-mpv-builds@v1.0.0
        with:
          release: v1.0.0

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1.1.3
        with:
          grok-ref: v20.4.16

      - name: Build release
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: cargo build --release -p dcpwizard-cli

      # the deb carries libgrokj2k and FFmpeg at /usr/lib/dcpwizard, like the desktop deb and rpm
      - name: Bundle libgrokj2k and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$GITHUB_WORKSPACE/grok-install/lib64" "$GITHUB_WORKSPACE/grok-install/lib"
          do
            if [ -f "$candidate/libgrokj2k.so.1" ]
            then
              GROK_LIB="$candidate"
              break
            fi
          done
          if [ -z "${GROK_LIB:-}" ]
          then
            echo "no libgrokj2k.so.1 under grok-install/lib64 or grok-install/lib"
            exit 1
          fi
          # Cargo.toml's [package.metadata.deb] assets name every library this copies
          scripts/bundle-linux-cli-libraries.sh rust/target/release/dcpwizard rust/target/release "$GROK_LIB" "$FFMPEG_MPV_DIR/lib"
          cp "$FFMPEG_MPV_DIR/THIRD-PARTY-LICENSES" rust/target/release/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt
          # strip run after patchelf can corrupt the binary, so cargo deb gets --no-strip
          strip rust/target/release/dcpwizard
          patchelf --set-rpath /usr/lib/dcpwizard rust/target/release/dcpwizard

      - name: Build .deb package
        working-directory: rust
        run: cargo deb -p dcpwizard-cli --no-build --no-strip

      # the LD_LIBRARY_PATH setup-grok and ffmpeg-mpv-builds export would find libraries the package does not carry
      - name: Test installed CLI
        shell: bash
        run: |
          set -euo pipefail
          package=$(realpath "$(find rust/target/debian -name '*.deb' -print -quit)")
          dpkg-deb -f "$package" Depends
          dpkg-deb -c "$package"
          dpkg-deb -c "$package" | grep -F ./usr/share/doc/dcpwizard/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt
          sudo apt-get install -y "$package"
          env -u LD_LIBRARY_PATH dcpwizard --version
          env -u LD_LIBRARY_PATH ldd /usr/bin/dcpwizard
          for library in libgrokj2k.so.1 libavcodec.so.62 libavfilter.so.11 libswscale.so.9
          do
            env -u LD_LIBRARY_PATH ldd /usr/bin/dcpwizard | grep -F "$library => /usr/lib/dcpwizard/$library"
          done
          # the runner already has every library the package depends on, a clean image does not
          docker run --rm -v "$package:/tmp/dcpwizard.deb:ro" ubuntu:24.04 bash -euo pipefail -c \
            'apt-get update && apt-get install -y --no-install-recommends /tmp/dcpwizard.deb && dcpwizard --version'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcpwizard-deb
          path: rust/target/debian/*.deb

  release:
    needs: [build, deb]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.deb
