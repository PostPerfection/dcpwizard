name: GUI Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-2022
            name: Windows

    runs-on: ${{ matrix.os }}
    name: GUI (${{ matrix.name }})

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.8.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxml2-dev \
            libssl-dev \
            libxerces-c-dev \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libarchive-tools

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$OPENSSL_PREFIX/lib:$(brew --prefix xerces-c)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix xerces-c)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install libxml2 openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.8

      - uses: PostPerfection/setup-libmpv@v1
        with:
          mpv-release: 20260828
          mpv-archive: mpv-dev-x86_64-20260828-git-182fa6ca49.7z

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Build CLI sidecar (Unix)
        if: runner.os != 'Windows'
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        shell: bash
        run: |
          cargo build --release -p dcpwizard-cli
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          cp target/release/dcpwizard ../gui/src-tauri/dcpwizard-${TRIPLE}
          # the deb and rpm put the sidecar in /usr/bin, same rpath as the gui
          if [ "$RUNNER_OS" = "Linux" ]; then
            patchelf --set-rpath '$ORIGIN/../lib/dcpwizard' ../gui/src-tauri/dcpwizard-${TRIPLE}
          fi

      - name: Build CLI sidecar (Windows)
        if: runner.os == 'Windows'
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: |
          cargo build --release -p dcpwizard-cli
          Copy-Item "target/release/dcpwizard.exe" "../gui/src-tauri/dcpwizard-x86_64-pc-windows-msvc.exe"

      # the app and its cli sidecar both link grokj2k.dll at load time.
      # tauri.windows.conf.json lists it as a bundle resource, which the
      # installer drops next to the exes, so it has to exist before the build.
      - name: Stage grok dll (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item "$env:GITHUB_WORKSPACE/grok-install/bin/grokj2k.dll" "gui/src-tauri/"

      # the deb and rpm ship it through bundle.linux.*.files, the .app through bundle.macOS.frameworks
      - name: Stage grok library (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$GITHUB_WORKSPACE/grok-install/lib64" "$GITHUB_WORKSPACE/grok-install/lib"; do
            if [ -d "$candidate" ]; then GROK_LIB="$candidate"; break; fi
          done
          if [ -z "${GROK_LIB:-}" ]; then
            echo "no grok library directory under grok-install"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            library=libgrokj2k.so.1
          else
            library=libgrokj2k.1.dylib
          fi
          cp -L "$GROK_LIB/$library" "gui/src-tauri/$library"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENSSL_STATIC: "1"
        with:
          projectPath: gui
          # a dispatch run builds the bundles as workflow artifacts and publishes nothing
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('DCP Wizard {0}', github.ref_name) || '' }}
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          releaseBody: "See the release notes for details."
          releaseDraft: false
          prerelease: false

      # every check runs with the loader path setup-grok exported unset
      - name: The packages run without a grok install (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle=gui/src-tauri/target/release/bundle

          check_binaries() {
            for binary in "$@"; do
              env -u LD_LIBRARY_PATH ldd "$binary"
              if env -u LD_LIBRARY_PATH ldd "$binary" | grep -q "not found"; then
                echo "$binary has an unresolved library"
                exit 1
              fi
            done
          }

          ls -la "$bundle"/rpm "$bundle"/deb "$bundle"/appimage
          rpm=$(find "$bundle/rpm" -name '*.rpm' ! -name '*.sig' -print -quit)
          rpm -qpl "$rpm"
          rpm_root=$(mktemp -d)
          bsdtar -xf "$rpm" -C "$rpm_root"
          if [ ! -f "$rpm_root/usr/lib/dcpwizard/libgrokj2k.so.1" ]; then
            echo "the rpm does not carry usr/lib/dcpwizard/libgrokj2k.so.1"
            find "$rpm_root" -type f | sort
            exit 1
          fi
          check_binaries "$rpm_root/usr/bin/dcpwizard" "$rpm_root/usr/bin/dcpwizard-gui"
          env -u LD_LIBRARY_PATH "$rpm_root/usr/bin/dcpwizard" --version

          appimage=$(realpath "$(find "$bundle/appimage" -name '*.AppImage' -print -quit)")
          appimage_root=$(mktemp -d)
          (cd "$appimage_root" && "$appimage" --appimage-extract >/dev/null)
          if [ ! -f "$appimage_root/squashfs-root/usr/lib/libgrokj2k.so.1" ]; then
            echo "the AppImage does not carry usr/lib/libgrokj2k.so.1"
            ls "$appimage_root/squashfs-root/usr/lib"
            exit 1
          fi
          env -u LD_LIBRARY_PATH "$appimage_root/squashfs-root/usr/bin/dcpwizard" --version

          deb=$(realpath "$(find "$bundle/deb" -name '*.deb' -print -quit)")
          dpkg-deb -f "$deb" Depends | grep -F libmpv2
          sudo apt-get install -y "$deb"
          check_binaries /usr/bin/dcpwizard /usr/bin/dcpwizard-gui
          env -u LD_LIBRARY_PATH dcpwizard --version

      # the bundler rewrites no load command, a missed relink shows up as a runner path
      - name: The app runs without a grok install (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # the bundler deletes the .app once the dmg exists, the tar.gz is what ships
          ls -la gui/src-tauri/target/release/bundle/macos
          app_root=$(mktemp -d)
          tar -xzf "$(find gui/src-tauri/target/release/bundle/macos -name '*.app.tar.gz' -print -quit)" -C "$app_root"
          app=$(find "$app_root" -maxdepth 1 -name '*.app' -print -quit)
          if [ ! -f "$app/Contents/Frameworks/libgrokj2k.1.dylib" ]; then
            echo "the app does not carry Contents/Frameworks/libgrokj2k.1.dylib"
            find "$app" -type f | sort
            exit 1
          fi
          for binary in "$app/Contents/MacOS/dcpwizard" "$app/Contents/MacOS/dcpwizard-gui"; do
            otool -L "$binary"
            if otool -L "$binary" | grep -q "/Users/runner"; then
              echo "$binary loads a library from the build tree"
              exit 1
            fi
          done
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$app/Contents/MacOS/dcpwizard" --version
          # a missing dylib kills the gui at exec, so it has to be alive a few seconds later
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$app/Contents/MacOS/dcpwizard-gui" &
          gui_pid=$!
          sleep 8
          kill -0 "$gui_pid"
          kill "$gui_pid"
